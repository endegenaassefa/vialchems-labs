# Mogtrix backend foundation (for super-prompt's fork-and-prune directive)
mogtrix_foundation:
  repo_path: /root/mogtrix-website/
  site_subdir: /root/mogtrix-website/site/
  stack:
    framework: Next.js 16.0.7
    runtime: React 19, TypeScript 5.9
    db_orm: Supabase Postgres 17 (Edge SQL + RLS)
    auth: Supabase Auth (email/password, JWT, role separation)
    hosting: Vercel (iad1, auto-deploy on main)
    payment: pluggable adapter pattern (Stripe live, stub for dev)
    email: Resend
    state: Zustand 5.0.8
    validation: Zod 4.4
    monitoring: Sentry 10.51
    3d: '@react-three/fiber 9.4 (vial scenes)'
  reusable_layers_high_value:
    - lib/supabase/{server,browser,service,proxy,env,index}.ts
    - lib/auth/{customer,admin,catalog}.ts plus app/auth/{actions,callback}/
    - lib/payments/{config,index,server,types,stripe,stub,reconciliation}.ts plus app/api/payments/*
    - lib/orders.ts, lib/ops-orders.ts, app/api/orders/route.ts, app/api/ops/(protected)/orders/*
    - lib/customer-qualification.ts, lib/attestations.ts, app/api/access/route.ts (pre-built RUO qualification flow that maps almost 1:1 onto peptide-buyer qualification)
    - lib/validation/{catalog,access}.ts (Zod)
    - supabase/{config.toml,schema.sql,seed.sql} plus migrations/
    - lib/cart-store.ts plus components/checkout-boundary.tsx
    - vercel.json, vitest.config.ts, playwright.config.ts, next.config.ts
    - components/ui/{Button,Card,Input,Pill,Specs,CoaRow,FieldLabel,Vial,VialScene}.tsx (neutral primitives)
    - lib/design/{tokens,motion,types,index}.ts (color tokens + spacing + easing)
    - app/globals.css (typography, atmospheric gradients, motion keyframes)
  prune_targets:
    - public/brand/mogtrix_*.png (brand assets)
    - public/visuals/{hero-lab,category-*}.png (brand-styled imagery)
    - lib/content/site.ts (siteConfig.name domain description)
    - components/site-header.tsx, components/compliance-footer.tsx (branded chrome)
    - lib/content/legal.ts (replace MOGTRIX strings)
    - lib/content/products.ts plus supabase/seed.sql (replace catalog)
    - app/page.tsx (rewrite hero copy for peptide brand)
    - components/home-proof-row.tsx (replace hardcoded products)
    - app/faq/page.tsx, app/testing/page.tsx, lib/content/faq.ts, lib/content/testing.ts (rewrite content)
    - lib/age-gate-store.ts (rebrand text, optionally upgrade to jurisdiction-aware)
  compliance_extensions_required:
    - jurisdiction_state_blocklist_extend_lib_compliance_ts
    - glp1_pattern_filter_extend_assertMarketingCopySafe
    - third_party_age_verification_optional_intellicheck_socure
    - supplier_vetting_in_qualification_flow
    - peptide_specific_attestations_no_compounding_pharmacy_claims
  env_vars_to_swap:
    - NEXT_PUBLIC_SITE_URL
    - NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY
    - PAYMENT_PROVIDER, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET
    - ORDER_EMAIL_FROM, ORDER_STAFF_EMAILS, RESEND_API_KEY
    - NEXT_PUBLIC_SENTRY_DSN, SENTRY_AUTH_TOKEN, SENTRY_ORG, SENTRY_PROJECT

