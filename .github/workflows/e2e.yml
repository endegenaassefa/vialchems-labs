name: e2e

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright + visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SKIP_DNS_CHECK: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Iron Law 2.24 — no .skip(true) / .only( in CI E2E
        run: |
          if grep -rnE "\.skip\(true|\.only\(" tests/e2e/; then
            echo "Iron Law 2.24 violation: skip/only found in CI E2E"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Run a11y E2E
        run: npx playwright test tests/e2e/a11y.spec.ts

      - name: Run checkout E2E (ACH + crypto)
        run: npx playwright test tests/e2e/checkout-ach.spec.ts tests/e2e/checkout-crypto.spec.ts

      - name: Run visual regression
        id: visual_regression
        run: npx playwright test tests/e2e/visual-regression.spec.ts

      - name: Upload Playwright diff artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-diff-${{ github.run_id }}
          path: |
            test-results/**/*
            tests/e2e/visual-regression.spec.ts-snapshots/diff/**
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: PR comment with diff link
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const artifactUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                'Visual regression or E2E test failed.',
                '',
                `Review the [Playwright artifacts](${artifactUrl}) for diff thumbnails and failure traces.`,
                '',
                'Per Iron Law 2.25 + 2.40, visual-regression baseline updates require operator approval via `.github/CODEOWNERS` on `tests/e2e/visual-regression.spec.ts-snapshots/`.',
              ].join('\n'),
            });
